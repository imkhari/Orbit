server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: orbit-backend
  config:
    import:
      - optional:classpath:application-secret.yml
      - optional:file:application-secret.yml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orbit_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

orbit:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days

  ai:
    provider: gemini
    gemini:
      api-key: ${GEMINI_API_KEY:demo_key}
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
